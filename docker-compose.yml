services:
  backend:
    build:
      context: ./backend
    container_name: nursery-backend-container
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: nursery-frontend-container
    ports:
      - "3000:3000"
    depends_on:
      - backend